name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            constraints: "aiohttp==3.8.6 pydantic==2.3.0"
          - python-version: "3.10"
            constraints: "aiohttp==3.8.4 pydantic==2.3.0"
          - python-version: "3.10"
            constraints: "aiohttp==3.9.5 pydantic==2.3.0"
          - python-version: "3.11"
            constraints: ""
          - python-version: "3.12"
            constraints: ""
          - python-version: "3.13"
            constraints: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ${{ matrix.constraints }}
      - run: pytest
